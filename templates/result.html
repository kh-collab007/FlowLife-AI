<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FlowLife AI</title>
</head>
<body>
    <h1>FlowLife AI</h1>
    <h2>あなたの目標</h2>
    {% for goal in goals %}
    <p>{{goal.id}}:{{goal.text}} 
        {% if goal.done %}
            ✅ 達成済み
        {% else %}
            ⏳ 未達成
        {% endif %}
    </p>
    {% if not goal.done %}
    <form action="/complete/{{goal.id}}"method="post">
        <button type="submit">達成</button>
    </form>
    {% endif %}
    <form action ="/delete/{{goal.id}}"method = "post">
        <button type = "submit">削除</button>
    </form>
    {% endfor %}
    <a href="/">トップページに戻る</a>
</body>

</html>
